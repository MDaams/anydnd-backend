name: Generate Architecture Docs

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - master

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    # Vereist permissie om wijzigingen terug te kunnen schrijven naar de repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Architecture Diagram
        run: npm run docs:arch

      - name: Commit architecture updates if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the exact filename with proper casing
          git add README.md

          # Check if there are any actual modifications to commit
          if git status --porcelain | grep -q .; then
            git commit -m "docs: auto-update architecture diagram [skip ci]"
            git push
          else
            echo "No architecture changes to commit."
          fi
